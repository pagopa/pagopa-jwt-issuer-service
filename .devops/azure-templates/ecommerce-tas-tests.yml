parameters:
  # Required
  - name: "ENVIRONMENT"
    type: string

  - name: ref
    displayName: "TAS repo branch/tag"
    type: string
    default: main

resources:
  - repository: tas
    type: github
    name: pagopa/azure-pipeline-templates
    ref: refs/heads/PQ-456-add-qa-tas-template-dependsOn   # template repo branch (→ refs/tags/v1 once merged)
    endpoint: 'io-azure-devops-github-ro'   # ← GitHub service connection name (Project settings → Service connections)

steps:

  - stage: TAS_tests_${{ parameters.ENVIRONMENT }}
    pool:
      vmImage: 'ubuntu-latest'
    jobs:
      - job: Run_TAS_tests
        steps:
          - template: templates/qa-tas/tas-integration-test.yml@tas
            parameters:
              testType: e2e
              suite: checkout
              environment: ${{ parameters.ENVIRONMENT }}
              mode: async
              ref: ${{ parameters.ref }}
              verifyOrchestrator: true
              publishTests: true
              stepName: TAS_E2E_${{ parameters.ENVIRONMENT }}
              # Behave tag filter. Leave empty to keep the workflow default (@runnable,
              # used by the integration suites). Override to target other suites, e.g.
              # set 'tags: @e2e' to run the e2e checkout suite (testType: e2e).
              tags: '@e2e'
              # GitHub PAT forwarded to the orchestrator as GITHUB_TOKEN. Source it
              # from a SECRET pipeline variable (here 'INTEGRATION_TEST_PAT') so it is
              # masked in the logs — do not paste the raw token into this file.
              githubToken: $(ECOMMERCE_TAS_GITHUB_TOKEN)
              # Optional overrides — exposed inline because they are typically
              # set-once-and-forget (not toggled from the portal at run-time):
              # pythonVersion: "3.11"
              # poolVmImage:   "ubuntu-latest"
              # testRunTitle:  ""                # default — auto-generated as "TAS — <suite> / <env> (<ref>)"
              #
              # Supply-chain integrity, pinned mode (true SRI). When set, the sidecar
              # verification is replaced by a check against this explicit digest.
              # Compute it once against the version you trust and bake it in:
              #   curl -sSfL https://raw.githubusercontent.com/pagopa/pagopa-platform-integration-test/refs/tags/v1/scripts/tas_orchestrator.py | sha256sum
              # orchestratorSha256: "a68b6c43c98517352c6d182df4a97b67e33a94ed79ae56949b1f6e6a179b5fe1"
              # Testing parameter for setting dependecy to other stages
              #dependsOnStages: ['Deploy_UAT_pagoPA']
          - template: templates/qa-tas/tas-integration-test.yml@tas
            parameters:
              testType: integration
              suite: tas_pass
              environment: ${{ parameters.ENVIRONMENT }}
              mode: async
              ref: ${{ parameters.ref }}
              verifyOrchestrator: true
              publishTests: true
              stepName: TAS_INTEGRATION_${{ parameters.ENVIRONMENT }}
              # Behave tag filter. Leave empty to keep the workflow default (@runnable,
              # used by the integration suites). Override to target other suites, e.g.
              # set 'tags: @e2e' to run the e2e checkout suite (testType: e2e).
              tags: '@runnable'
              # GitHub PAT forwarded to the orchestrator as GITHUB_TOKEN. Source it
              # from a SECRET pipeline variable (here 'INTEGRATION_TEST_PAT') so it is
              # masked in the logs — do not paste the raw token into this file.
              githubToken: $(ECOMMERCE_TAS_GITHUB_TOKEN)
              # Optional overrides — exposed inline because they are typically
              # set-once-and-forget (not toggled from the portal at run-time):
              # pythonVersion: "3.11"
              # poolVmImage:   "ubuntu-latest"
              # testRunTitle:  ""                # default — auto-generated as "TAS — <suite> / <env> (<ref>)"
              #
              # Supply-chain integrity, pinned mode (true SRI). When set, the sidecar
              # verification is replaced by a check against this explicit digest.
              # Compute it once against the version you trust and bake it in:
              #   curl -sSfL https://raw.githubusercontent.com/pagopa/pagopa-platform-integration-test/refs/tags/v1/scripts/tas_orchestrator.py | sha256sum
              # orchestratorSha256: "a68b6c43c98517352c6d182df4a97b67e33a94ed79ae56949b1f6e6a179b5fe1"
              # Testing parameter for setting dependecy to other stages
              #dependsOnStages: ['Deploy_UAT_pagoPA']